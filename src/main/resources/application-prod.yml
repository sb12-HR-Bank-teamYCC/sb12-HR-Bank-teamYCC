spring:
  sql:
    init:
      mode: always
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.web: info